services:
  - type: web
    name: whatsapp-requirement-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WHATSAPP_PROVIDER
        value: green_api
      - key: GATEWAY_TYPE
        value: green_api
      - key: GATEWAY_INSTANCE_ID
        value: "710522726064"
      - key: GATEWAY_API_TOKEN
        value: "52d9555e5c6b4c65b3ebc1119abb5e62bf64e52d8dde4ac7aa"
      - key: GATEWAY_API_URL
        value: "https://api.green-api.com"
      - key: GOOGLE_SHEET_WEBHOOK_URL
        value: "https://script.google.com/macros/s/AKfycby-a2A6tpShmCJjeOVZ-dkNf2POJFiozd6Lz5cC6Krtsbv1qUgVUKq2eKir_DRnrf592A/exec"
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: DEBOUNCE_SECONDS
        value: 1.5
