services:
  - type: web
    name: whatsapp-requirement-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WHATSAPP_PROVIDER
        value: green_api
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: DEBOUNCE_SECONDS
        value: 1.5
